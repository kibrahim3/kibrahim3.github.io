<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Kyrellos Ibrahim</title>
  <meta name="description" content="Kyrellos Ibrahim is a PhD student at UCSF using deep learning to engineer polyketide synthases for materials biosynthesis.">
  <link rel="canonical" href="https://kyrellos.com/">
  <meta property="og:title" content="Kyrellos Ibrahim">
  <meta property="og:description" content="PhD student at UCSF using deep learning to engineer polyketide synthases for materials biosynthesis.">
  <meta property="og:type" content="website">
  <meta property="og:url" content="https://kyrellos.com/">
  <meta name="color-scheme" content="dark">
  <meta name="theme-color" content="#000000">
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <style>
    /*
      ============================================================
      TEMPORARY PLACEHOLDER PAGE
      A black screen with one small photo bouncing around it.
      The photo runs away from the mouse if you try to point at it,
      and bounces off the mouse if the mouse is sitting still.
      The real home page is saved next to this file as
      index-draft.html. To bring it back, delete this file and
      rename index-draft.html to index.html.

      Things you can change here without touching anything else:
        - the photo:  replace the file  me.jpg  (keep the name)
        - its size:   the  width  line under  #me  below
        - its speed:  the  SPEED  number near the bottom
        - how it dodges the mouse:  FLEE_SPEED,  REACH  and  IDLE_AFTER,
                                    right below SPEED

      There is also a faint status line that flashes on and off, and shows
      up somewhere new each time:
        - what it says:    the  <p id="status">  line further down
        - how faint it is: the  --faint  number under  #status  below
                           (0 is invisible, 1 is solid white)
        - how fast it flashes:  the  2s  on the  animation  line below
        - to remove it:    delete the  <p id="status">  line

      And a secret: pressing Shift+Cmd+K makes the photo slow to a crawl and
      stop dodging for 3 seconds. Clicking it in that time opens soon.html.
        - how long you get:   CATCH_SECONDS  near the bottom
        - how slow it creeps: CRAWL_SPEED,   right below that
        - where it sends you: SECRET_PAGE,   right below that
        - the keys:           the line with  'KeyK'  a little further down
      ============================================================
    */
    html, body {
      height: 100%;
      margin: 0;
      background: #000;
      overflow: hidden;
    }

    #me {
      /* Centered until the script takes over (and if motion is turned off). */
      position: fixed;
      inset: 0;
      margin: auto;
      width: clamp(27px, 5.1vmin, 48px);
      height: auto;
      display: block;
      user-select: none;
      -webkit-user-drag: none;
    }

    #me.bouncing {
      inset: auto;
      top: 0;
      left: 0;
      margin: 0;
      will-change: transform;
    }

    #status {
      --faint: 0.3;
      /* Sits still near the bottom until the script takes over (and if motion is turned off). */
      position: fixed;
      left: 50%;
      bottom: 8vh;
      transform: translateX(-50%);
      margin: 0;
      font: 13px/1 ui-monospace, "SF Mono", Menlo, Consolas, monospace;
      letter-spacing: 0.04em;
      color: #fff;
      opacity: var(--faint);
      white-space: nowrap;
      pointer-events: none;
      user-select: none;
    }

    #status.flashing {
      left: 0;
      top: 0;
      bottom: auto;
      opacity: 0;
      animation: status-flash 2s linear infinite;
    }

    /* Dark for a moment (this is when it moves), fade in, stay, fade out, dark again. */
    @keyframes status-flash {
      0%   { opacity: 0; }
      10%  { opacity: 0; }
      22%  { opacity: var(--faint); }
      80%  { opacity: var(--faint); }
      92%  { opacity: 0; }
      100% { opacity: 0; }
    }

    .visually-hidden {
      position: absolute;
      width: 1px;
      height: 1px;
      overflow: hidden;
      clip-path: inset(50%);
      white-space: nowrap;
    }
  </style>
</head>
<body>

  <h1 class="visually-hidden">Kyrellos Ibrahim</h1>

  <p id="status">status: almost back</p>

  <!-- If me.jpg is missing, the "KI" icon bounces instead so the page is never empty. -->
  <img id="me" src="me.jpg" alt="Kyrellos Ibrahim" draggable="false"
       onerror="this.onerror=null; this.src='favicon.svg';">

  <script>
    (function () {
      var SPEED = 150;       // normal drifting speed, in pixels per second
      var FLEE_SPEED = 900;  // top speed when it is running away from the mouse
      var REACH = 3;         // how close the mouse can get before it reacts,
                             // measured in photo-widths from the photo's middle
      var IDLE_AFTER = 1;    // seconds the mouse must sit still before the photo stops
                             // running from it and just bounces off it like a wall

      var CATCH_SECONDS = 3;         // how long the secret keys make the photo catchable
      var CRAWL_SPEED = 15;          // how fast it creeps during that time, in pixels per second
      var SECRET_PAGE = 'soon.html'; // where a successful click on the photo goes

      var img = document.getElementById('me');

      // The secret: Shift+Cmd+K (Shift+Ctrl+K on Windows) opens a short window in
      // which the photo slows to a crawl and stops dodging. Click it in time and
      // you are sent to SECRET_PAGE. Nothing on screen says the window is open.
      var catchUntil = 0;
      window.addEventListener('keydown', function (e) {
        // e.code is the physical K key, whatever letter the modifiers turn it into.
        if (e.code !== 'KeyK' || !e.shiftKey || !(e.metaKey || e.ctrlKey) || e.altKey || e.repeat) return;
        e.preventDefault();
        catchUntil = performance.now() + CATCH_SECONDS * 1000;
      });
      img.addEventListener('click', function () {
        if (performance.now() < catchUntil) window.location.href = SECRET_PAGE;
      });

      // People who ask their device for less motion get the photo sitting still.
      // (The secret still works for them: the photo is just already not moving.)
      if (window.matchMedia('(prefers-reduced-motion: reduce)').matches) return;

      var x, y, vx, vy, w, h, last;
      var pointer = null;  // where the mouse (or a finger) is and when it last moved,
                           // or null if it is away

      function measure() {
        w = img.offsetWidth;
        h = img.offsetHeight;
      }

      function randomHeading(speed) {
        // A diagonal that is never too flat or too steep, so it visits the whole screen.
        var angle = (25 + Math.random() * 40) * Math.PI / 180;
        vx = speed * Math.cos(angle) * (Math.random() < 0.5 ? -1 : 1);
        vy = speed * Math.sin(angle) * (Math.random() < 0.5 ? -1 : 1);
      }

      function start() {
        img.classList.add('bouncing');
        measure();
        x = Math.random() * Math.max(0, window.innerWidth - w);
        y = Math.random() * Math.max(0, window.innerHeight - h);
        randomHeading(SPEED);
        last = performance.now();
        requestAnimationFrame(step);
      }

      // Steer away from the mouse. Returns true while the mouse is close enough to matter.
      function flee(dt, maxX, maxY) {
        if (!pointer) return false;

        var dx = x + w / 2 - pointer.x;
        var dy = y + h / 2 - pointer.y;
        var dist = Math.sqrt(dx * dx + dy * dy);
        var reach = Math.max(w, h) * REACH;
        if (dist >= reach) return false;

        // Direction pointing straight away from the mouse.
        var ax, ay;
        if (dist < 0.5) {
          var a = Math.random() * 2 * Math.PI;
          ax = Math.cos(a); ay = Math.sin(a);
        } else {
          ax = dx / dist; ay = dy / dist;
        }

        // If "away" points into a wall, slide along the wall instead of
        // pressing against it, and break out of corners toward open space.
        var edge = 3;
        var blockedX = (x <= edge && ax < 0) || (x >= maxX - edge && ax > 0);
        var blockedY = (y <= edge && ay < 0) || (y >= maxY - edge && ay > 0);
        if (blockedX && blockedY) {
          if (Math.abs(dx) > Math.abs(dy)) { ay = ay < 0 ? 1 : -1; ax = 0; }
          else                             { ax = ax < 0 ? 1 : -1; ay = 0; }
        } else if (blockedX) {
          ay = Math.abs(ay) > 0.15 ? (ay < 0 ? -1 : 1) : (y < maxY / 2 ? 1 : -1);
          ax = 0;
        } else if (blockedY) {
          ax = Math.abs(ax) > 0.15 ? (ax < 0 ? -1 : 1) : (x < maxX / 2 ? 1 : -1);
          ay = 0;
        }

        // The closer the mouse, the faster it runs and the harder it turns.
        var closeness = 1 - dist / reach;
        var fleeSpeed = SPEED + (FLEE_SPEED - SPEED) * closeness;
        var turn = Math.min(1, 30 * closeness * dt);
        vx += (ax * fleeSpeed - vx) * turn;
        vy += (ay * fleeSpeed - vy) * turn;
        return true;
      }

      // With the mouse out of the way, ease back to the normal speed and
      // nudge the heading back to a diagonal if the escape left it too flat.
      function settle(dt) {
        var s = Math.sqrt(vx * vx + vy * vy);
        if (s < 1) { randomHeading(SPEED); return; }
        var ux = vx / s, uy = vy / s;
        if (Math.abs(ux) < 0.42) ux += (ux < 0 ? -1 : 1) * 1.5 * dt;
        if (Math.abs(uy) < 0.42) uy += (uy < 0 ? -1 : 1) * 1.5 * dt;
        var n = Math.sqrt(ux * ux + uy * uy);
        s += (SPEED - s) * Math.min(1, 2.5 * dt);
        vx = ux / n * s;
        vy = uy / n * s;
      }

      // While the secret window is open: brake hard down to a creep, same direction.
      function crawl(dt) {
        var s = Math.sqrt(vx * vx + vy * vy);
        if (s < 0.01) { randomHeading(CRAWL_SPEED); return; }
        var ns = s + (CRAWL_SPEED - s) * Math.min(1, 10 * dt);
        vx *= ns / s;
        vy *= ns / s;
      }

      // Hard rule: the mouse never gets to actually touch the photo. If a fast
      // swipe lands inside the photo's personal space, the photo is moved to the
      // nearest free spot on the edge of that space and darts off from there.
      // (Against a wall that slides it sideways; in a corner it hops out.)
      function keepClear(maxX, maxY) {
        if (!pointer) return;

        var space = 0.5 * Math.sqrt(w * w + h * h) + 0.3 * Math.max(w, h);
        var dx = x + w / 2 - pointer.x;
        var dy = y + h / 2 - pointer.y;
        var dist = Math.sqrt(dx * dx + dy * dy);
        if (dist >= space) return;

        var away = dist < 0.5 ? Math.random() * 2 * Math.PI : Math.atan2(dy, dx);
        // When it has to go sideways, prefer the side it was already heading toward.
        var side = Math.cos(away) * vy - Math.sin(away) * vx >= 0 ? 1 : -1;

        // Try straight away from the mouse first, then fan out further and
        // further to each side until a spot that is fully on screen turns up.
        for (var i = 0; i <= 48; i++) {
          var a = away + Math.ceil(i / 2) * (Math.PI / 24) * (i % 2 ? side : -side);
          var nx = pointer.x + Math.cos(a) * space - w / 2;
          var ny = pointer.y + Math.sin(a) * space - h / 2;
          if (nx >= 0 && nx <= maxX && ny >= 0 && ny <= maxY) {
            var s = Math.max(Math.sqrt(vx * vx + vy * vy), FLEE_SPEED * 0.75);
            x = nx; y = ny;
            vx = Math.cos(a) * s; vy = Math.sin(a) * s;
            return;
          }
        }
      }

      // A mouse that is sitting still is just an obstacle: the photo bounces off
      // the little arrow the same way it bounces off the edges of the screen.
      function bounceOffMouse(maxX, maxY) {
        // Roughly the box the arrow is drawn in (its tip is the top-left corner).
        var left = pointer.x - 1, right = pointer.x + 12;
        var top = pointer.y - 1,  bottom = pointer.y + 18;

        var overlapX = Math.min(x + w, right) - Math.max(x, left);
        var overlapY = Math.min(y + h, bottom) - Math.max(y, top);
        if (overlapX <= 0 || overlapY <= 0) return;

        var fromLeft = x + w / 2 < (left + right) / 2;
        var fromTop = y + h / 2 < (top + bottom) / 2;
        var outX = fromLeft ? left - w : right;   // where the photo would sit after
        var outY = fromTop ? top - h : bottom;    // being pushed clear on each axis

        // Bounce off whichever face it only just touched; if there is no room on
        // screen to do that (arrow jammed against an edge), use the other face.
        var sideways = overlapX < overlapY;
        for (var attempt = 0; attempt < 2; attempt++) {
          if (sideways && outX >= 0 && outX <= maxX) {
            x = outX; vx = fromLeft ? -Math.abs(vx) : Math.abs(vx);
            return;
          }
          if (!sideways && outY >= 0 && outY <= maxY) {
            y = outY; vy = fromTop ? -Math.abs(vy) : Math.abs(vy);
            return;
          }
          sideways = !sideways;
        }
      }

      function step(now) {
        // Cap the time step so the photo does not teleport after the tab was hidden.
        var dt = Math.min((now - last) / 1000, 0.05);
        last = now;

        var maxX = Math.max(0, window.innerWidth - w);
        var maxY = Math.max(0, window.innerHeight - h);

        // Has the mouse been sitting still long enough to count as an obstacle?
        var idle = pointer !== null && now - pointer.t > IDLE_AFTER * 1000;

        // Is the secret window open? Then it creeps and lets the mouse reach it.
        var catching = now < catchUntil;

        if (catching) crawl(dt);
        else if (idle || !flee(dt, maxX, maxY)) settle(dt);

        x += vx * dt;
        y += vy * dt;

        if (x <= 0)    { x = 0;    vx = Math.abs(vx); }
        if (x >= maxX) { x = maxX; vx = -Math.abs(vx); }
        if (y <= 0)    { y = 0;    vy = Math.abs(vy); }
        if (y >= maxY) { y = maxY; vy = -Math.abs(vy); }

        if (catching) { /* the mouse is allowed to touch it */ }
        else if (idle) bounceOffMouse(maxX, maxY);
        else keepClear(maxX, maxY);

        img.style.transform = 'translate3d(' + x + 'px,' + y + 'px,0)';
        requestAnimationFrame(step);
      }

      window.addEventListener('resize', measure);

      // Keep track of the mouse. A finger on a touch screen counts too,
      // but only while it is actually touching.
      function track(e) { pointer = { x: e.clientX, y: e.clientY, t: performance.now() }; }
      function forget() { pointer = null; }
      window.addEventListener('pointermove', track);
      window.addEventListener('pointerdown', track);
      window.addEventListener('pointerup', function (e) { if (e.pointerType !== 'mouse') forget(); });
      window.addEventListener('pointercancel', forget);
      document.documentElement.addEventListener('pointerleave', forget);

      // Wait until the picture has a size (this also covers the fallback icon).
      if (img.complete && img.naturalWidth > 0) start();
      else img.addEventListener('load', start, { once: true });
    })();

    // The status line: each time it has faded out, move it somewhere new
    // before it fades back in.
    (function () {
      var el = document.getElementById('status');
      if (!el) return;

      // People who ask their device for less motion get it sitting still, not flashing.
      if (window.matchMedia('(prefers-reduced-motion: reduce)').matches) return;

      var EDGE = 12;  // keep at least this many pixels from the edges of the screen
      var sx = null, sy = null;

      function move() {
        var roomX = Math.max(0, window.innerWidth - el.offsetWidth - 2 * EDGE);
        var roomY = Math.max(0, window.innerHeight - el.offsetHeight - 2 * EDGE);
        var farEnough = 0.25 * Math.min(window.innerWidth, window.innerHeight);
        var nx, ny;

        // Pick a random spot, trying again if it lands too close to the last one.
        for (var i = 0; i < 20; i++) {
          nx = EDGE + Math.random() * roomX;
          ny = EDGE + Math.random() * roomY;
          if (sx === null) break;
          var dx = nx - sx, dy = ny - sy;
          if (Math.sqrt(dx * dx + dy * dy) >= farEnough) break;
        }

        sx = nx; sy = ny;
        el.style.transform = 'translate(' + Math.round(nx) + 'px,' + Math.round(ny) + 'px)';
      }

      el.classList.add('flashing');
      move();
      el.addEventListener('animationiteration', move);
    })();

    // A typed code: press the CODE_KEY key CODE_COUNT times in a row to open CODE_PAGE.
    (function () {
      var CODE_KEY = '4';
      var CODE_COUNT = 4;
      var CODE_PAGE = 'betrayal.html';
      var CODE_GAP = 2;  // seconds allowed between presses before the count starts over

      var count = 0, lastPress = 0;
      window.addEventListener('keydown', function (e) {
        if (e.repeat) return;  // holding the key down does not count as typing it again
        // Shift, Cmd and the like are not typing; pressing them alone changes nothing.
        if (e.key === 'Shift' || e.key === 'Meta' || e.key === 'Control' || e.key === 'Alt') return;

        var now = performance.now();
        var typed = e.key === CODE_KEY && !e.metaKey && !e.ctrlKey && !e.altKey;
        if (!typed) { count = 0; return; }

        count = now - lastPress > CODE_GAP * 1000 ? 1 : count + 1;
        lastPress = now;
        if (count >= CODE_COUNT) { count = 0; window.location.href = CODE_PAGE; }
      });
    })();
  </script>

</body>
</html>
